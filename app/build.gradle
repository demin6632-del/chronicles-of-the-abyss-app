plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chroniclesoftheabyss.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chroniclesoftheabyss.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def storePath = project.findProperty('RELEASE_STORE_FILE')
            def storePass = project.findProperty('RELEASE_STORE_PASSWORD')
            def keyAliasValue = project.findProperty('RELEASE_KEY_ALIAS')
            def keyPass = project.findProperty('RELEASE_KEY_PASSWORD')
            if (storePath && storePass && keyAliasValue && keyPass) {
                storeFile = file(storePath)
                storePassword = storePass
                keyAlias = keyAliasValue
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (project.findProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
