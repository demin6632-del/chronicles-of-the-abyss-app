<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b14"><title>Хроники Бездны — Покорение Башни</title><style>:root{--bg:#080b14;--panel:#111827;--panel2:#0d1422;--line:#26334d;--text:#eef2ff;--muted:#8d99b5;--accent:#8b5cf6;--good:#35d07f;--bad:#ff5577;--gold:#f6c453;--blue:#58a6ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:radial-gradient(circle at top,#14182a,#080b14 65%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer;touch-action:manipulation}#app{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column}header{padding:12px;background:rgba(8,11,20,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.sub{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center;font-size:11px}.stat b{display:block;font-size:13px;margin-top:2px}#screen{flex:1;overflow:auto;padding:10px 10px 88px}.card{background:linear-gradient(180deg,#111827,#0c121e);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.15)}h1,h2,h3{margin:0 0 8px}h1{font-size:27px}h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}.accent{color:#c4b5fd}.btn{width:100%;background:#182238;border:1px solid #30405f;border-radius:12px;padding:11px 10px;margin:5px 0;text-align:left;font-weight:700}.primary{background:#39266b;border-color:#7655c9}.goodBtn{background:#143324;border-color:#2c6d4b}.dangerBtn{background:#3b1825;border-color:#743348}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.badge{display:inline-block;padding:3px 7px;border:1px solid #35445f;border-radius:99px;font-size:10px;margin:2px;background:#0c1422}.bar{height:9px;background:#070a10;border:1px solid #26334d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}.hp i{background:#e64b69}.mp i{background:#4d9dff}.xp i{background:#9b6cff}.item{padding:10px;border:1px solid var(--line);border-radius:11px;background:#0c1421;margin:5px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tower{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.floor{min-height:65px;border:1px solid #26334d;border-radius:10px;background:#101827;padding:6px;text-align:center;font-size:10px}.floor.done{border-color:#2c6d4b}.floor.current{outline:2px solid var(--gold)}.floor.boss{border-color:#a63f57;background:#28131b}.fight{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fighter{background:#0c1320;border:1px solid var(--line);border-radius:14px;padding:10px}.intent{padding:8px;margin-top:7px;border:1px solid #6d3d4c;background:#26151d;border-radius:10px;font-size:12px}.log{font-size:12px;line-height:1.45;padding:8px 10px;border-left:3px solid #34415b;background:#0b111d;border-radius:8px;margin:4px 0}.log.good{border-left-color:var(--good)}.log.combat{border-left-color:var(--bad)}footer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(7,10,17,.97);border-top:1px solid var(--line);z-index:10}.choice{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c1421;margin:7px 0}.choice.active{border-color:#8b5cf6;box-shadow:0 0 12px rgba(139,92,246,.2)}.equip{display:grid;grid-template-columns:1fr 1fr;gap:7px}.equip .item{margin:0}.quest{border-left:3px solid #7655c9}.notice{padding:10px;border-radius:10px;background:#121c30;border:1px solid #30405f;margin-bottom:8px}</style></head><body><div id="app"></div><script>'use strict';const KEY='chronicles_tower_save_v3';const CLASSES={warrior:{name:'Воин',icon:'⚔️',hp:130,mp:40,atk:13,def:8,desc:'Сильный фронтовик: высокий запас здоровья и защита.',skills:[['heavy','Тяжёлый удар','1.7× урон'],['guard','Стойка','+18 блока'],['rage','Ярость','2.1× урон, цена — часть HP']]},mage:{name:'Маг',icon:'🔮',hp:88,mp:75,atk:16,def:3,desc:'Мастер стихий: мощные заклинания и контроль.',skills:[['fire','Огненный шар','1.9× урон + горение'],['frost','Ледяной импульс','1.45× урон + шанс оглушения'],['storm','Грозовой разряд','2.2× урон']]},rogue:{name:'Разбойник',icon:'🗡️',hp:100,mp:48,atk:15,def:4,desc:'Быстрый боец: критические удары и яд.',skills:[['flurry','Шквал','2 удара по 0.9×'],['venom','Отравленный выпад','1.3× + яд'],['shadow','Теневой рывок','2.0× и уклонение']]},paladin:{name:'Паладин',icon:'🛡️',hp:145,mp:45,atk:12,def:10,desc:'Защитник Башни: выдерживает тяжёлые бои.',skills:[['heavy','Карательный удар','1.65× урон'],['guard','Святая стойка','+22 блока'],['heal','Свет Бездны','восстановление HP']]},warlock:{name:'Чернокнижник',icon:'🜏',hp:94,mp:78,atk:14,def:3,desc:'Тёмная магия: сильный урон ценой риска.',skills:[['fire','Пламя Пустоты','1.95× + горение'],['venom','Порча','1.35× + яд'],['shadow','Теневой разлом','2.1× урон']]},ranger:{name:'Следопыт',icon:'🏹',hp:108,mp:55,atk:16,def:4,desc:'Дальний бой: точность, крит и серии.',skills:[['flurry','Залп','2 быстрых удара'],['venom','Отравленная стрела','1.35× + яд'],['shadow','Выстрел из тени','2.0× урон']]}};const WEAPONS=[{name:'Старый меч',type:'weapon',atk:3,def:0,price:0},{name:'Клинок Предела',type:'weapon',atk:7,def:0,price:90},{name:'Рунический посох',type:'weapon',atk:9,def:0,price:130},{name:'Клинки Тени',type:'weapon',atk:8,def:1,price:150},{name:'Молот Хранителя',type:'weapon',atk:10,def:2,price:210},{name:'Лук Вершины',type:'weapon',atk:11,def:0,price:240},{name:'Меч Сердца Бездны',type:'weapon',atk:16,def:2,price:500}];const ARMOR=[{name:'Походная одежда',type:'armor',atk:0,def:2,price:0},{name:'Кольчуга Предела',type:'armor',atk:0,def:6,price:100},{name:'Мантия Архимага',type:'armor',atk:2,def:5,price:150},{name:'Доспех Хранителя',type:'armor',atk:0,def:10,price:230},{name:'Плащ Тени',type:'armor',atk:3,def:6,price:190},{name:'Броня Сердца Бездны',type:'armor',atk:4,def:14,price:520}];const BOSSES={10:['Хранитель Первой Печати',230,22,10],20:['Архонт Пустоты',360,29,13],30:['Пожиратель Башен',520,36,16],40:['Безымянный Владыка',720,44,20],50:['Сердце Бездны',1000,52,24]};const QUESTS=[{id:'q10',floor:10,name:'Первая печать',desc:'Победить босса 10 этажа.',reward:150},{id:'q20',floor:20,name:'Вторая печать',desc:'Победить босса 20 этажа.',reward:250},{id:'q30',floor:30,name:'Глубже тьмы',desc:'Победить босса 30 этажа.',reward:400},{id:'q40',floor:40,name:'Предел смертных',desc:'Победить босса 40 этажа.',reward:650},{id:'q50',floor:50,name:'Сердце Башни',desc:'Победить финального босса.',reward:1000}];const ENEMIES=['Порождение Бездны','Костяной страж','Теневой охотник','Осквернённый маг','Пожиратель света','Рыцарь Пустоты'];const state={hero:null,floor:1,screen:'home',enemy:null,block:0,turn:0,logs:[],inventory:[],quests:QUESTS.map(q=>({...q,done:false}))};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.hero){Object.assign(state,x);return true}}catch(e){}return false}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cls(){return CLASSES[state.hero.cls]}function maxHp(){return state.hero.baseHp+state.hero.level*8+state.inventory.filter(x=>x.equipped&&x.type==='armor').reduce((a,x)=>a+x.def*2,0)}function atk(){return state.hero.baseAtk+Math.floor(state.hero.level*1.4)+state.inventory.filter(x=>x.equipped).reduce((a,x)=>a+(x.atk||0),0)}function def(){return state.hero.baseDef+Math.floor(state.hero.level*.7)+state.inventory.filter(x=>x.equipped).reduce((a,x)=>a+(x.def||0),0)}function xpNeed(){return 80+state.hero.level*45}function log(t,type=''){state.logs.push({t,type});state.logs=state.logs.slice(-12)}function initHero(name,c){const d=CLASSES[c];state.hero={name:name||'Герой',cls:c,level:1,xp:0,gold:40,baseHp:d.hp,baseAtk:d.atk,baseDef:d.def,hp:d.hp,mp:d.mp,maxMp:d.mp,potions:3,skillPoints:0};state.floor=1;state.inventory=[{...WEAPONS[0],id:'starter',equipped:true},{...ARMOR[0],id:'starter-armor',equipped:true}];state.quests=QUESTS.map(q=>({...q}));state.logs=[];log('Ты входишь в Башню Бездны. Один герой. Один путь наверх.','good');save()}function healFull(){state.hero.hp=maxHp();state.hero.mp=state.hero.maxMp}function gainXP(n){state.hero.xp+=n;while(state.hero.xp>=xpNeed()){state.hero.xp-=xpNeed();state.hero.level++;state.hero.skillPoints++;state.hero.maxMp+=3;state.hero.hp=maxHp();state.hero.mp=state.hero.maxMp;log('Новый уровень: '+state.hero.level+'!','good')}}function header(){if(!state.hero)return '<header><div class="logo">♆ Хроники Бездны</div><div class="sub">Покорение Башни • постоянный герой</div></header>';let h=state.hero;return `<header><div class="top"><div><div class="logo">♆ ${esc(h.name)}</div><div class="sub">${cls().icon} ${cls().name} • Этаж ${state.floor}</div></div><button class="btn" style="width:auto;margin:0;padding:8px 11px" onclick="menu()">☰</button></div><div class="stats"><div class="stat">❤️<b>${Math.ceil(h.hp)}/${maxHp()}</b></div><div class="stat">💧<b>${h.mp}/${h.maxMp}</b></div><div class="stat">🪙<b>${h.gold}</b></div><div class="stat">⭐<b>${h.level}</b></div></div></header>`}function home(){return `<div class="card"><h1>♆ Хроники Бездны</h1><div class="notice"><b>Покорение Башни</b><br><span class="muted">Непрерывное приключение одного героя. Забегов нет: персонаж сохраняется и поднимается всё выше.</span></div><button class="btn primary" onclick="newHero()">⚔️ Начать покорение</button><button class="btn" onclick="continueGame()">📜 Продолжить игру</button></div><div class="card"><h2>Что ждёт внутри</h2><div class="small muted">Классы героя • оружие • броня • боссы • 50 этажей • квесты • уровни • зелья • постоянное сохранение.</div></div>`}function newHero(){state.screen='create';render()}function createScreen(){return `<div class="card"><h1>Создание героя</h1><label class="small muted">Имя героя</label><input id="heroName" value="Герой Бездны" maxlength="24"><h2>Выбери класс</h2><div id="classChoices">${Object.entries(CLASSES).map(([id,c],i)=>`<button class="choice ${i===0?'active':''}" data-cls="${id}" onclick="pickClass('${id}')"><b>${c.icon} ${c.name}</b><br><span class="small muted">${c.desc}</span><br><span class="small">❤️ ${c.hp} • ⚔️ ${c.atk} • 🛡️ ${c.def} • 💧 ${c.mp}</span></button>`).join('')}</div><button class="btn primary" onclick="createSelected()">Начать путь</button></div>`}let selectedClass='warrior';function pickClass(c){selectedClass=c;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x.dataset.cls===c))}function createSelected(){initHero(document.getElementById('heroName').value.trim(),selectedClass);state.screen='tower';render()}function continueGame(){if(load()){state.screen='tower';render()}else{state.screen='create';render()}}function tower(){let start=Math.max(1,state.floor-2),end=Math.min(50,state.floor+7);return `<div class="card"><h2>🏰 Башня Бездны</h2><div class="muted small">Твой постоянный путь. Пройденные этажи остаются пройденными.</div><div class="tower">${Array.from({length:end-start+1},(_,i)=>start+i).map(f=>`<div class="floor ${f<state.floor?'done':''} ${f===state.floor?'current':''} ${BOSSES[f]?'boss':''}"><b>${f}</b><br>${BOSSES[f]?'👑 Босс':'Этаж'}</div>`).join('')}</div><hr><div class="grid2"><button class="btn primary" onclick="enterFloor()">⬆️ Покорять этаж ${state.floor}</button><button class="btn" onclick="rest()">🔥 Отдохнуть</button></div></div><div class="card"><h3>📜 Квесты</h3>${state.quests.map(q=>`<div class="item quest"><b>${q.done?'✅':'📜'} ${q.name}</b><div class="small muted">${q.desc}</div><span class="gold small">Награда: ${q.reward} 🪙</span></div>`).join('')}</div><div class="card"><h3>📖 Хроника</h3>${state.logs.slice(-6).map(x=>`<div class="log ${x.type}">${x.t}</div>`).join('')}</div>`}function enterFloor(){let f=state.floor;if(f>50){state.screen='victory';render();return}let e;if(BOSSES[f]){let b=BOSSES[f];e={name:b[0],hp:b[1]+state.hero.level*8,max:b[1]+state.hero.level*8,atk:b[2],def:b[3],boss:true}}else{let hp=55+f*8+state.hero.level*6;e={name:ENEMIES[(f*7+state.hero.level)%ENEMIES.length],hp,max:hp,atk:8+Math.floor(f*.65),def:2+Math.floor(f/7),boss:false}}state.enemy=e;state.block=0;state.turn=0;state.screen='combat';log((e.boss?'👑 Босс ':'⚔️ Враг: ')+e.name,'combat');render()}function playerDamage(mult=1){let raw=atk()*mult;let crit=Math.random()<.12;return Math.max(1,Math.floor(raw*(crit?1.7:1)))}function enemyTurn(){if(!state.enemy)return;let e=state.enemy;if(e.hp<=0)return;let raw=e.atk+Math.floor(Math.random()*5);let dmg=Math.max(1,raw-def()-state.block);state.block=0;state.hero.hp-=dmg;log(e.name+' наносит '+dmg+' урона.','combat');if(state.hero.hp<=0){state.hero.hp=1;state.floor=Math.max(1,state.floor-1);healFull();log('Герой пал, но путь продолжается. Ты возвращён к началу предыдущего этажа.','bad');state.enemy=null;state.screen='tower';save();render()}}function act(kind,arg){if(!state.enemy)return;let h=state.hero,e=state.enemy;if(kind==='attack'){let d=playerDamage();e.hp-=Math.max(1,d-e.def);log('Ты наносишь '+Math.max(1,d-e.def)+' урона.','combat')}else if(kind==='defend'){state.block=10+def();log('Ты принимаешь защитную стойку.','good')}else if(kind==='potion'){if(h.potions<=0)return;h.potions--;let heal=Math.floor(maxHp()*.32);h.hp=Math.min(maxHp(),h.hp+heal);log('Зелье восстановило '+heal+' HP.','good')}else if(kind==='skill'){let s=cls().skills.find(x=>x[0]===arg);if(!s)return;let cost=arg==='guard'?7:arg==='heal'?10:9;if(h.mp<cost)return;h.mp-=cost;if(arg==='guard'){state.block=22+def();log('Ты используешь '+s[1]+': усиленная защита.','good')}else if(arg==='heal'){let v=Math.floor(maxHp()*.28);h.hp=Math.min(maxHp(),h.hp+v);log('Свет Бездны восстановил '+v+' HP.','good')}else if(arg==='flurry'){let d=Math.max(1,playerDamage(.85)-e.def)+Math.max(1,playerDamage(.85)-e.def);e.hp-=d;log('Шквал наносит '+d+' урона.','combat')}else if(arg==='venom'){let d=Math.max(1,playerDamage(1.3)-e.def);e.hp-=d;e.poison=3;log('Отравленный удар: '+d+' урона.','combat')}else if(arg==='shadow'){let d=Math.max(1,playerDamage(2)-e.def);e.hp-=d;state.block=12;log('Теневой рывок наносит '+d+' урона.','combat')}else{let mult=arg==='fire'?1.9:arg==='frost'?1.45:arg==='storm'?2.2:arg==='heavy'?1.7:2.1;let d=Math.max(1,playerDamage(mult)-e.def);e.hp-=d;if(arg==='fire')e.burn=3;if(arg==='frost'&&Math.random()<.35)e.stun=1;log(s[1]+': '+d+' урона.','combat')}}if(e.poison&&e.hp>0){e.hp-=4;log('Яд наносит 4 урона.','combat')}if(e.burn&&e.hp>0){e.hp-=5;log('Горение наносит 5 урона.','combat')}if(e.hp<=0){winFloor();return}if(!e.stun)enemyTurn();else{e.stun=0;log('Враг оглушён.','good')}state.turn++;save();render()}function winFloor(){let f=state.floor,e=state.enemy,xp=35+f*8+(e.boss?80:0),gold=18+f*3+(e.boss?120:0);gainXP(xp);state.hero.gold+=gold;log('Победа! +'+xp+' XP, +'+gold+' 🪙.','good');if(e.boss){let q=state.quests.find(q=>q.floor===f);if(q&&!q.done){q.done=true;state.hero.gold+=q.reward;log('Квест выполнен: '+q.name+'. +'+q.reward+' 🪙','good')}}if(f<50){state.floor++;healFull();let drop=lootForFloor(f);if(drop){state.inventory.push(drop);log('Найдена экипировка: '+drop.name+'!','good')}}else{state.floor=51;state.screen='victory';state.enemy=null;save();render();return}state.enemy=null;state.screen='tower';save();render()}function lootForFloor(f){if(f%5!==0)return null;let pool=f>=45?[WEAPONS[6],ARMOR[5]]:f>=30?[WEAPONS[5],ARMOR[4]]:f>=20?[WEAPONS[4],ARMOR[3]]:[WEAPONS[1],ARMOR[1]];return {...pool[Math.floor(Math.random()*pool.length)],id:'loot-'+Date.now(),equipped:false}}function rest(){let cost=8+state.floor;if(state.hero.gold<cost){log('Недостаточно золота для отдыха.','bad')}else{state.hero.gold-=cost;healFull();log('Ты отдыхаешь у костра и полностью восстанавливаешься.','good')}save();render()}function combat(){let h=state.hero,e=state.enemy;return `<div class="card"><div class="fight"><div class="fighter"><h3>${cls().icon} ${esc(h.name)}</h3><div class="small">Уровень ${h.level}</div><div class="bar hp"><i style="width:${Math.max(0,h.hp/maxHp()*100)}%"></i></div><div class="small">❤️ ${Math.ceil(h.hp)}/${maxHp()}</div><div class="bar mp"><i style="width:${h.mp/h.maxMp*100}%"></i></div><div class="small">💧 ${h.mp}/${h.maxMp}</div></div><div class="fighter"><h3>${e.boss?'👑':'👹'} ${esc(e.name)}</h3><div class="small">${e.boss?'Босс этажа '+state.floor:'Враг этажа '+state.floor}</div><div class="bar hp"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div><div class="small">❤️ ${Math.max(0,e.hp)}/${e.max}</div></div></div></div><div class="card"><h3>⚔️ Действия</h3><button class="btn primary" onclick="act('attack')">⚔️ Атаковать</button><button class="btn" onclick="act('defend')">🛡️ Защищаться</button><button class="btn" onclick="act('potion')" ${h.potions?'':'disabled'}>🧪 Зелье (${h.potions})</button><div class="grid2">${cls().skills.map(s=>`<button class="btn" onclick="act('skill','${s[0]}')">${s[1]}<br><span class="small muted">${s[2]}</span></button>`).join('')}</div></div><div class="card"><h3>📖 Бой</h3>${state.logs.slice(-8).map(x=>`<div class="log ${x.type}">${x.t}</div>`).join('')}</div>`}function inventory(){return `<div class="card"><h2>🎒 Инвентарь</h2><div class="equip">${state.inventory.map((x,i)=>`<div class="item"><b>${x.type==='weapon'?'⚔️':'🛡️'} ${x.name}</b><div class="small">${x.atk?'⚔️ +'+x.atk:''} ${x.def?'🛡️ +'+x.def:''}</div><button class="btn ${x.equipped?'goodBtn':''}" onclick="equip(${i})">${x.equipped?'Надето':'Надеть'}</button></div>`).join('')}</div></div>`}function equip(i){let x=state.inventory[i];state.inventory.forEach((y,j)=>{if(y.type===x.type)y.equipped=j===i});state.hero.hp=Math.min(state.hero.hp,maxHp());save();render()}function character(){let h=state.hero;return `<div class="card"><h2>${cls().icon} ${esc(h.name)}</h2><div class="small muted">${cls().name}: ${cls().desc}</div><hr><div class="grid2"><div>❤️ Здоровье<br><b>${Math.ceil(h.hp)}/${maxHp()}</b></div><div>💧 Мана<br><b>${h.mp}/${h.maxMp}</b></div><div>⚔️ Атака<br><b>${atk()}</b></div><div>🛡️ Защита<br><b>${def()}</b></div><div>⭐ Уровень<br><b>${h.level}</b></div><div>📈 Опыт<br><b>${h.xp}/${xpNeed()}</b></div></div><hr><div class="small muted">Очки навыков: ${h.skillPoints}</div></div><div class="card"><h3>🧠 Навыки класса</h3>${cls().skills.map(s=>`<div class="item"><b>${s[1]}</b><div class="small muted">${s[2]}</div></div>`).join('')}</div>`}function go(s){state.screen=s;render()}function menu(){state.screen='menu';render()}function menuScreen(){return `<div class="card"><h2>☰ Меню</h2><button class="btn" onclick="go('tower')">🏰 Башня</button><button class="btn" onclick="go('character')">👤 Герой</button><button class="btn" onclick="go('inventory')">🎒 Инвентарь</button><button class="btn" onclick="save();alert('Прогресс сохранён');">💾 Сохранить</button><button class="btn dangerBtn" onclick="go('home')">🚪 На главный экран</button></div>`}function victory(){return `<div class="card"><h1>🏆 Башня покорена</h1><div class="notice">Ты достиг вершины и победил <b>Сердце Бездны</b>.</div><p>Твой герой сохранил весь путь, уровень, экипировку и историю.</p><button class="btn primary" onclick="go('tower')">Продолжить исследование</button></div>`}function render(){let body=state.screen==='home'?home():state.screen==='create'?createScreen():state.screen==='tower'?tower():state.screen==='combat'?combat():state.screen==='inventory'?inventory():state.screen==='character'?character():state.screen==='menu'?menuScreen():state.screen==='victory'?victory():home();document.getElementById('app').innerHTML=header()+`<main id="screen">${body}</main>`+(state.hero&&state.screen!=='create'&&state.screen!=='home'?'<footer><div class="grid3"><button class="btn" onclick="go(\'tower\')">🏰 Башня</button><button class="btn" onclick="go(\'character\')">👤 Герой</button><button class="btn" onclick="go(\'inventory\')">🎒 Инвентарь</button></div></footer>':'')}load();render();</script></body></html>
