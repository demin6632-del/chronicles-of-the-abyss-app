  ok:false,
  init(){
    try{
      const s=window.localStorage;
      const k='__abyss_probe__';
      s.setItem(k,'1'); s.removeItem(k);
      this.ok=true;
    }catch(e){this.ok=false;}
  },
  get(k){
    try{return this.ok?window.localStorage.getItem(k):(MEMORY[k]??null)}
    catch(e){this.ok=false;return MEMORY[k]??null}
  },
  set(k,v){
    try{if(this.ok){window.localStorage.setItem(k,v);return}}catch(e){this.ok=false}
    MEMORY[k]=v;
  },
  del(k){
    try{if(this.ok){window.localStorage.removeItem(k);return}}catch(e){this.ok=false}
    delete MEMORY[k];
  }
};

function hash(s){let h=2166136261>>>0;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function RNG(seed){
  let a=hash(seed);
  return {
    next(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296},
    int(n){return Math.floor(this.next()*n)},
    pick(a){return a?.length?a[this.int(a.length)]:null},
    chance(p){return this.next()<p}
  }
}

/* ---------- Map: real connected branching graph ---------- */
const NODE_TYPES=['combat','combat','event','chest','camp','shop','risk','elite'];
function generateMap(){
  const floors=7,rows=3;
  S.map=[];let prev=[];
  for(let f=0;f<floors;f++){
    const layer=[];
    for(let r=0;r<rows;r++){
      let type;
      if(f===floors-1)type='boss';
      else if(f===0)type='combat';
      else{
        const weights=f===6?['combat','elite','event','camp','risk']:NODE_TYPES;
        type=R.pick(weights)
      }
      layer.push({id:`${f}-${r}`,f,r,type,links:[],used:false})
    }
    if(f>0){
      for(const n of prev){
        const choices=[n.r,Math.max(0,n.r-1),Math.min(rows-1,n.r+1)].filter((v,i,a)=>a.indexOf(v)===i);
        R.pick(choices); // consume RNG deterministically
      }
    }
    S.map.push(...layer);prev=layer;
  }
  // Connect each node to 1-2 adjacent nodes, then repair reachability.
  for(let f=0;f<floors-1;f++){
    const a=S.map.filter(n=>n.f===f),b=S.map.filter(n=>n.f===f+1);
    for(const n of a){
      const opts=b.filter(x=>Math.abs(x.r-n.r)<=1);
      const shuffled=opts.slice().sort(()=>R.next()-.5);
      const count=R.chance(.45)?1:2;
      n.links=shuffled.slice(0,count).map(x=>x.id)
    }
    for(const target of b){
      if(!a.some(n=>n.links.includes(target.id))){
        const source=a.slice().sort((x,y)=>Math.abs(x.r-target.r)-Math.abs(y.r-target.r))[0];
        source.links.push(target.id)
      }
    }
  }
  S.map.filter(n=>n.f===0).forEach((n,i)=>{if(i>0)n.type='combat'});
}
function currentNode(){return S.map.find(n=>n.id===S.node)}
function availableNodes(){const n=currentNode();return n?S.map.filter(x=>n.links.includes(x.id)):[]}
function chooseNode(id){
  const n=availableNodes().find(x=>x.id===id);if(!n||n.used)return;
  S.node=id;n.used=true;S.floor=n.f+1;S.stats.rooms++;enterNode(n);save();render()
}

}

/* ---------- Rewards ---------- */
function makeRewards(count){
  const out=[];let tries=0;
  while(out.length<count&&tries++<200){
    let kind=R.pick(['item','item','relic','skill']);
    if(kind==='relic'&&!RELICS.some(x=>!hasRelic(x.id)))kind='item';
    if(kind==='skill'&&S.skills.every(id=>(S.skillLevels[id]||0)>=2))kind='item';
    let q;
    if(kind==='item'){
      const base=clone(R.pick(ITEMS.filter(x=>x.id!=='cursedBlade'||S.floor>=3)));
      base.rarity=rarityRoll();q={type:'item',data:base}
    }else if(kind==='relic'){
      q={type:'relic',data:clone(R.pick(RELICS.filter(x=>!hasRelic(x.id))))}
    }else{
      const pool=S.skills.filter(id=>(S.skillLevels[id]||0)<2);q={type:'skill',data:R.pick(pool)}
    }
    if(!out.some(x=>x.type===q.type&&(x.type==='skill'?x.data===q.data:x.data.id===q.data.id)))out.push(q)
  }
  return out
}
function takeReward(i){

}

function dmgCalc(att,def,mult=1,magic=false){
  let m=mult;
  if(magic)m*=att.magicMul||1;
  if(hasStatus(att,'stun'))return 0;
  if(hasStatus(att,'slow')&&att===S.p)m*=.9;
  if(def.statuses){
    if(hasStatus(def,'bleed')&&att===S.p)m*=1+(S.p.bonusBleed||0);
    if(hasStatus(def,'poison')&&att===S.p)m*=1+(S.p.bonusPoison||0);
    if(hasStatus(def,'burn')&&att===S.p)m*=1+(S.p.bonusBurn||0);
    if(hasRelic('pyre')&&hasStatus(def,'burn')&&att===S.p)m*=1.25;
  }
  if(att===S.p&&S.p.hp/S.p.max<.5)m*=1+(S.p.riskMul||0);
  if(att===S.p&&hasRelic('mirror'))m*=1+(S.curses.length*.07);
  if(att===S.p&&hasRelic('crown')&&S.curses.length>=2)m*=1.15;
  let raw=(magic?(att.atk+att.magic):att.atk)*m-(def.def+((def===S.p)?S.p.tempDef:0))*.52;
  return Math.max(1,Math.floor(raw+R.next()*5-2))
}

  let d=dmgCalc(p,e,mult);if(crit){d=Math.floor(d*1.8);S.stats.crit++;p.combo++;if(hasRelic('fang'))p.combo++;p.critTempo=p.critTempo||0;p.critTempo=.10}
  if((hasItem('voidblade'))&&crit){p.hp=Math.max(1,p.hp-2);addLog('🩸 Клинок Бездны требует кровь','warn')}
  if((hasItem('cursedBlade'))&&crit){p.hp=Math.max(1,p.hp-2)}
  if(crit&&hasRelic('venomCore')&&hasStatus(e,'poison')){const st=statusGet(e,'poison');st.turns+=2;addLog('☠️ Ядро токсина продлевает яд','good')}

}
function useSkill(id){
  if(!canAct())return;const p=S.p,e=enemy(),sk=SKILLS[id],lv=S.skillLevels[id]||0;
  if(!sk||p.mp<sk.cost){toast('Недостаточно MP');return}p.mp-=sk.cost;let text='',d=0;
  if(id==='heavy'){d=dmgCalc(p,e,sk.base);if(hasStatus(e,'bleed'))d=Math.floor(d*(1+(p.up.heavyVsBleed||0)));dealPlayerDamage(d,'Тяжёлый удар');addStatus(e,'bleed',3+(p.up.heavyBleed||0))}
  else if(id==='guard'){p.block+=Math.floor((16+(p.up.guardBlock||0))*(p.blockMul||1));p.tempDef=3;addLog('🛡️ Стойка: +'+p.block+' блока','good')}
  else if(id==='rage'){const cost=Math.ceil(p.max*(p.up.rageCost||.04));p.hp=Math.max(1,p.hp-cost);d=dmgCalc(p,e,2);if(p.hp/p.max<.4)d=Math.floor(d*(1+(p.up.rageLow||0)));dealPlayerDamage(d,'Ярость')}
  else if(id==='fire'){d=dmgCalc(p,e,sk.base,true);if(hasStatus(e,'burn'))d=Math.floor(d*1.1);dealPlayerDamage(d,'Огненный шар');addStatus(e,'burn',3+(p.up.fireBurn||0)+(hasRelic('heart')?1:0))}
  else if(id==='frost'){d=dmgCalc(p,e,sk.base);dealPlayerDamage(d,'Ледяной импульс');addStatus(e,'slow',2+(p.up.frostSlow||0));if(R.chance(.25+(p.up.frostStun||0)))addStatus(e,'stun',1)}
  else if(id==='storm'){d=dmgCalc(p,e,sk.base,true);if(hasStatus(e,'burn'))d=Math.floor(d*(1+(p.up.stormBurn||0)));dealPlayerDamage(d,'Грозовой разряд')}
  else if(id==='flurry'){for(let i=0;i<2;i++){d=dmgCalc(p,e,.85);if(p.combo>=4&&p.up.flurryCrit)d=Math.floor(d*1.8);dealPlayerDamage(d,'Шквал');if(e.hp<=0)break; if(p.up.flurryBleed)addStatus(e,'bleed',2)}p.combo++}
  else if(id==='venom'){d=dmgCalc(p,e,sk.base);if(hasStatus(e,'poison'))d=Math.floor(d*(1+(p.up.venomVs||0)));dealPlayerDamage(d,'Отравленный выпад');addStatus(e,'poison',4+(p.up.venom||0))}
  else if(id==='shadow'){d=dmgCalc(p,e,sk.base);if(p.combo>=3)d=Math.floor(d*1.8);if(p.up.execute&&e.hp/e.max<.25)d=Math.floor(d*(1+p.up.execute));dealPlayerDamage(d,'Теневой рывок');p.block+=p.up.shadowBlock||0}
  if(e.hp>0)endPlayerTurn();else winCombat()
}
function dealPlayerDamage(d,label){
  const e=enemy(),p=S.p;
  const blocked=Math.min(e.block||0,d);
  if(blocked)e.block=Math.max(0,(e.block||0)-blocked);
  const dealt=Math.max(0,d-blocked);
  e.hp=Math.max(0,e.hp-dealt);S.stats.damage+=dealt;p.combo=Math.min(9,p.combo+1);
  addLog('⚔️ '+label+': <b>'+dealt+'</b> урона'+(blocked?' ('+blocked+' заблокировано)':''),'combat')
}
function usePotion(){
  if(!canAct())return;
  const p=S.p;
  if((p.hp||0)>=p.max){toast('HP уже полностью восстановлено');return}
  if((S.potions||0)<=0){toast('Зелья закончились');return}
  const before=p.hp;
  const amount=Math.floor(p.max*.30);
  p.hp=Math.min(p.max,p.hp+amount);
  S.stats.heals+=(p.hp-before);
  S.potions--;
  addLog('🧪 Зелье лечения: +'+(p.hp-before)+' HP','good');
  endPlayerTurn();
}
function defend(){
  if(!canAct())return;const p=S.p;let b=Math.floor((8+Math.round(p.def*.8))*(p.blockMul||1));if(hasRelic('anchor'))b+=6;p.block+=b;p.mp=Math.min(p.maxmp,p.mp+5);addLog('🛡️ Защита: +'+b+' блока','good');endPlayerTurn()
}
function canAct(){return S.screen==='combat'&&S.combat&&!S.combat.over&&!enemy()?.hp?false:!!(S.screen==='combat'&&S.combat&&!S.combat.over&&enemy()?.hp>0)}
function endPlayerTurn(){
  if(enemy().hp<=0){winCombat();return}
  enemyTurn();if(S.p.hp<=0){loseRun();return}
  const st=tickStatuses(enemy(),false);if(st.length)addLog('☠️ '+st.join(', '),'combat');
  const pst=tickStatuses(S.p,true);if(pst.length)addLog('☠️ '+pst.join(', '),'warn');
  if(enemy().hp<=0){winCombat();return}
  S.p.mp=Math.min(S.p.maxmp,S.p.mp+1+(S.p.up.turnMana||0));S.p.tempDef=0;S.p.critTempo=Math.max(0,(S.p.critTempo||0)-.05);S.p.combo=Math.max(0,S.p.combo-1);
  S.combat.turn++;S.stats.turns++;setIntent();checkEye();save();render()
}
function enemyAttack(mult=1,forceCrit=false){
  const e=enemy(),p=S.p;if(hasStatus(e,'stun'))return;
  if(hasStatus(e,'slow'))mult*=.9;
  let d=dmgCalc(e,p,mult);if(forceCrit||R.chance(.08+S.floor*.01))d=Math.floor(d*1.6);
  let block=Math.min(p.block,d);p.block-=block;d-=block;
  if(hasCurse('glass'))d=Math.ceil(d*1.2);
  p.hp=Math.max(0,p.hp-d);addLog('💥 '+e.name+' наносит '+d+' урона'+(block?' ('+block+' заблокировано)':''),'combat');
  if(e.poison&&R.chance(.45))addStatus(p,'poison',3);
  if(hasItem('thorn')&&d>0){const thorn=S.inventory.find(x=>x.id==='thorn');const reflect=thorn.thorn||3;e.hp=Math.max(0,e.hp-reflect);S.stats.damage+=reflect;addLog('🌵 Шипастая броня: -'+reflect+' HP врагу','combat')}
}
function enemyTurn(){
  const e=enemy();if(!e)return;
  if(e.intent==='block'){e.block+=Math.floor(10+e.def*.7);addLog('🛡️ '+e.name+' укрепляется','combat')}
  else if(e.intent==='bleed'){enemyAttack(.9);addStatus(S.p,'bleed',3)}
  else if(e.intent==='poison'){enemyAttack(.9);addStatus(S.p,'poison',3)}
  else if(e.intent==='burn'){enemyAttack(.95);addStatus(S.p,'burn',3)}
  else if(e.intent==='crit'){enemyAttack(1.2,true)}
  else if(e.intent==='stun'){enemyAttack(.85);if(R.chance(.4))addStatus(S.p,'stun',1)}
  else if(e.intent==='heal'){e.hp=Math.min(e.max, e.hp+Math.floor(e.max*.15));addLog('💚 '+e.name+' лечится','combat')}
  else if(e.intent==='special'){enemyAttack(e.boss?1.45:1.25,true);if(e.boss)addStatus(S.p,e.phase>=2?'burn':'poison',3)}
  else if(e.intent==='summon'){
    enemyAttack(.8);
    if(e.boss&&e.id==='queen'){e.atk=Math.ceil(e.atk*1.05);addLog('👥 Королева Теней призывает теней: её атака растёт','combat')}
    else{e.hp=Math.min(e.max,e.hp+Math.floor(e.max*.1));addLog('👹 '+e.name+' восстанавливает силы','combat')}
  }
  else if(e.intent==='stomp'&&e.boss){enemyAttack(1.1);if(R.chance(.5))addStatus(S.p,'stun',1);addLog('💥 Минотавр сотрясает землю','combat')}
  else if(e.intent==='rage'&&e.boss){enemyAttack(e.hp/e.max<.5?1.8:1.35,true);addLog('🔥 Минотавр впадает в ярость','combat')}
  else if(e.intent==='fire'&&e.boss){enemyAttack(.95);addStatus(S.p,'burn',3);addLog('🔥 Пожиратель Искр обжигает тебя','combat')}
  else enemyAttack(1);
  if(e.boss){
    const hp=e.hp/e.max;
    if(e.phase===1&&hp<=.66){e.phase=2;e.atk=Math.ceil(e.atk*1.15);e.def+=2;addLog('🔥 Фаза II: '+e.name+' приходит в ярость!','warn')}
    if(e.phase===2&&e.phases>=3&&hp<=.33){e.phase=3;e.atk=Math.ceil(e.atk*1.18);addLog('🌌 Фаза III: Бездны становится слишком много...','warn')}
  }
}
function checkEye(){
  const p=S.p;if(hasRelic('eye')&&!p.eye&&p.hp/p.max<=.3){p.eye=true;heal(Math.floor(p.max*.25));p.mp=p.maxmp;addLog('👁️ Око Бездны спасает тебя!','good')}
}
function winCombat(){
  if(S.combat.over)return;S.combat.over=true;const e=enemy();
  let gold=Math.round(e.gold*(1+(META.levels.gold||0)*.05));
  if(hasRelic('idol')||S.inventory.some(x=>x.id==='greed'))gold=Math.round(gold*1.25);
  S.gold+=gold;S.stats.gold+=gold;S.stats.kills++;
  if(hasCurse('hunger'))S.gold=Math.max(0,S.gold-4);
  if(e.elite&&hasRelic('pulse'))heal(Math.floor(S.p.max*.1));
  if(e.boss){
    META.points+=15+S.floor*3;META.wins++;META.runs++;metaSave(META);S.ended=true;S.city.lastResult={type:'victory',floor:S.floor,gold:S.stats.gold||0};
    addLog('👑 БОСС ПОВЕРЖЕН!','good');
    S.postCombat={boss:true,name:e.name,gold:gold,elite:!!e.elite};
  }else{
    addLog('🏆 '+e.name+' повержен! +'+gold+' золота','good');
    S.rewards=makeRewards(hasRelic('crown')&&S.curses.length>=2?4:3);
    S.postCombat={boss:false,name:e.name,gold:gold,elite:!!e.elite};
  }
  setScreen('postcombat');save();render()
}
function continueAfterCombat(){
  if(S.screen!=='postcombat')return;
  if(S.postCombat?.boss){S.postCombat=null;setScreen('victory');save();render();return}
  S.postCombat=null;setScreen('reward');save();render()
}
function loseRun(){
  if(S.p.extraLives>0){S.p.extraLives--;S.p.hp=S.p.max;S.p.mp=S.p.maxmp;S.p.statuses=[];addLog('✨ Запасная жизнь!','good');setScreen('combat');save();render();return}
  S.stats.rooms=Math.max(S.stats.rooms,0);META.points+=Math.max(1,Math.floor(S.floor*2));META.runs++;metaSave(META);S.city.lastResult={type:'defeat',floor:S.floor,gold:S.stats.gold||0};setScreen('defeat');S.ended=true;save();render()
}

function campRest(){heal(Math.floor(S.p.max*.35));leaveRoom()}
function campMana(){S.p.mp=S.p.maxmp;addLog('💧 MP полностью восстановлена','good');leaveRoom()}

function forgeItem(i){
  const it=S.inventory[i];if(!it)return;if(it.rarity==='legendary'){toast('Легендарный предмет уже максимален');return}
  const order=['common','uncommon','rare','epic','legendary'],idx=order.indexOf(it.rarity),cost=25+idx*20;
  if(S.gold<cost){toast('Нужно '+cost+' золота');return}S.gold-=cost;it.rarity=order[idx+1];
  it.__bonus=it.__bonus||{atk:0,def:0,magic:0,crit:0};
  if(it.atk){S.p.atk+=1;it.__bonus.atk+=1}if(it.def){S.p.def+=1;it.__bonus.def+=1}if(it.magic){S.p.magic+=1;it.__bonus.magic+=1}S.stats.forged++;addLog('🔨 '+it.name+' улучшен','good');save();render()
}
function scrapItem(i){
  const it=S.inventory[i];if(!it)return;
  const val={common:10,uncommon:16,rare:24,epic:36,legendary:60}[it.rarity]||10;
  const b=it.__bonus||{atk:Math.round((it.atk||0)*(RARITY[it.rarity]?.mul||1)),def:Math.round((it.def||0)*(RARITY[it.rarity]?.mul||1)),magic:(it.magic||0)*(RARITY[it.rarity]?.mul||1),crit:it.crit||0};
  S.p.atk=Math.max(0,S.p.atk-(b.atk||0));S.p.def=Math.max(0,S.p.def-(b.def||0));S.p.magic=Math.max(0,S.p.magic-(b.magic||0));S.p.crit=Math.max(0,S.p.crit-(b.crit||0));
  S.inventory.splice(i,1);S.gold+=val;S.stats.scrapped++;recomputeBuild();addLog('♻️ Разобрано: +'+val+' золота','good');save();render()
}
function createShop(){
  const q=makeRewards(5);S.shop=q.map(x=>({...x,price:x.type==='relic'?75:x.type==='skill'?55:({common:30,uncommon:42,rare:60,epic:85,legendary:125}[x.data.rarity]||30)}))
}
function buy(i){
  const q=S.shop?.[i];
  if(!q)return;
  if(S.gold<q.price){toast('Недостаточно золота');return}
  // Check capacity BEFORE charging the player.
  if(q.type==='item' && S.inventory.length>=24){
    toast('Инвентарь переполнен. Сначала освободи место.');
    return;
  }
  if(q.type==='skill' && (S.skillLevels[q.data]||0)>=2){
    toast('Этот навык уже максимального уровня');
    return;
  }
  S.gold-=q.price;
  let ok=true;
  if(q.type==='relic')S.relics.push(clone(q.data));
  else if(q.type==='skill')ok=upgradeSkill(q.data);
  else ok=addItem(q.data);
  if(!ok){S.gold+=q.price;return;}
  S.shop.splice(i,1);
  recomputeBuild();
  save();render()
}
function riskChoice(kind){
  if(kind==='relic'){S.p.hp=Math.max(1,S.p.hp-20);S.gold+=35;giveRelic();addCurse('blood')}
  if(kind==='gold'){S.gold+=80;S.p.max=Math.max(1,S.p.max-12);S.p.hp=Math.min(S.p.hp,S.p.max)}
  if(kind==='elite'){setScreen('combat');startCombat(true);return}
  leaveRoom()
}
function eventAction(i){
  const a=S.event?.actions?.[i];if(!a)return;a[1]();S.event=null;setScreen('map');save();render()
}

  const p=S.p;return `<header><div class="top"><div><div class="logo">♆ Хроники Бездны</div><div class="sub">${S.screen==='city'?'🏙️ Город Предела':(S.cls?CLASSES[S.cls].name:'')} • ${S.screen==='city'?'Готов к походу':'Этаж '+S.floor+' • A'+S.asc+' • '+S.seed}</div></div><div style="display:flex;gap:5px;align-items:center">${S.screen!=='city'?'<button class="btn" style="width:auto;margin:0;padding:8px 11px" onclick="goBack()">←</button>':''}<button class="btn" style="width:auto;margin:0;padding:8px 11px" onclick="menu()">☰</button></div></div><div class="stats"><div class="stat">❤️<b>${Math.ceil(p.hp)}/${p.max}</b></div><div class="stat">💧<b>${Math.ceil(p.mp)}/${p.maxmp}</b></div><div class="stat">🪙<b>${S.gold}</b></div><div class="stat">☠️<b>${S.curses.length}</b></div></div></header>`
}
function tagsHTML(tags){return (tags||[]).map(t=>`<span class="badge">${TAG[t]||t}</span>`).join('')}
function normalizeTags(obj){if(!obj)return[];if(Array.isArray(obj.tags))return obj.tags;return obj.tag?[obj.tag]:[]}
function hasTag(obj,tag){return normalizeTags(obj).includes(tag)}
function tagsOf(obj){return normalizeTags(obj).slice()}
function addTag(obj,tag){if(!obj)return obj;if(!Array.isArray(obj.tags))obj.tags=normalizeTags(obj);if(!obj.tags.includes(tag))obj.tags.push(tag);return obj}
function collectBuildTags(){
  const out=new Set();
  if(S.cls&&CLASSES[S.cls])CLASSES[S.cls].tags.forEach(t=>out.add(t));
  (S.inventory||[]).forEach(x=>normalizeTags(x).forEach(t=>out.add(t)));
  (S.relics||[]).forEach(x=>normalizeTags(x).forEach(t=>out.add(t)));
  Object.keys(S.skillLevels||{}).forEach(id=>{if((S.skillLevels[id]||0)>0&&SKILLS[id])normalizeTags(SKILLS[id]).forEach(t=>out.add(t));});
  (S.allies||[]).forEach(x=>normalizeTags(x).forEach(t=>out.add(t)));
  return [...out];
}
function hasBuildTag(tag){return collectBuildTags().includes(tag)}
function buildTagCounts(){
  const out={};
  const add=obj=>normalizeTags(obj).forEach(t=>out[t]=(out[t]||0)+1);
  if(S.cls&&CLASSES[S.cls])add(CLASSES[S.cls]);
  (S.inventory||[]).forEach(add);(S.relics||[]).forEach(add);
  Object.keys(S.skillLevels||{}).forEach(id=>{if((S.skillLevels[id]||0)>0&&SKILLS[id])add(SKILLS[id]);});
  (S.allies||[]).forEach(add);
  return out;
}

function restoreSavedEvent(){
  if(!S.event)return;
  let src=null;
  if(Number.isInteger(S.event.sourceIndex))src=EVENTS[S.event.sourceIndex]||null;
  if(!src&&S.event.name)src=EVENTS.find(e=>e.name===S.event.name)||null;
  if(src)S.event=cloneEvent(src);

function tavernRoster(){
  const ids=Object.keys(ALLIES);
  const rng=RNG('TAVERN-'+Math.floor((META.runs||0)/1)+'-'+(META.essence||0));
  const out=[]; let tries=0;
  while(out.length<4&&tries++<30){

  }

function allyTurn(){
  if(!S.allies?.length||!enemy()?.hp)return;
  for(const a of S.allies){
    if(a.hp<=0)continue;
    if(a.skill==='heal'){
      const targets=[S.p,...S.allies].filter(x=>x.hp>0&&x.hp/x.maxHp<.7).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp);
      if(targets.length){
        const t=targets[0],amount=8+Math.floor(a.atk*.35);
        t.hp=Math.min(t.max||t.maxHp,t.hp+amount);
        addLog('💚 '+a.name+' лечит '+(t===S.p?'тебя':t.name)+' на '+amount,'good');
      }else{
        const d=Math.max(1,Math.floor(a.atk-enemy().def*.35));
        enemy().hp=Math.max(0,enemy().hp-d);addLog(a.icon+' '+a.name+' наносит '+d+' урона','combat');
      }
    }else{
      let mult=1,crit=false;
      if(a.skill==='crit'){crit=R.chance(.3);if(crit)mult=1.8}
      if(a.skill==='rage'&&a.hp/a.maxHp<.5)mult=1.5;
      const d=Math.max(1,Math.floor(a.atk*mult-enemy().def*.45+R.next()*3));
      enemy().hp=Math.max(0,enemy().hp-d);
      addLog(a.icon+' '+a.name+' наносит '+d+(crit?' критического':'')+' урона','combat');
      if(a.skill==='burn'&&R.chance(.65))addStatus(enemy(),'burn',2);
      if(a.skill==='poison'&&R.chance(.65))addStatus(enemy(),'poison',2);
    }
    if(enemy().hp<=0){winCombat();return}
  }
}

  const target=R.pick(living);
  if(target.hp/target.maxHp<.45){

  }
}

/* ---------- Share / Transfer ---------- */
function encodeShareData(){
  const data={v:1,run:S,meta:META};
  const json=JSON.stringify(data);
  let bin='';
  for(let i=0;i<json.length;i+=0x8000)bin+=unescape(encodeURIComponent(json.slice(i,i+0x8000)));
  return btoa(bin);
}
function decodeShareData(code){
  const bin=atob(String(code).trim());
  let out='';
  for(let i=0;i<bin.length;i+=0x8000)out+=decodeURIComponent(escape(bin.slice(i,i+0x8000)));
  return JSON.parse(out);
}
function exportShare(){
  save();
  const code=encodeShareData();
  openModal(`<h2>📤 Передать игру</h2><p class="small muted">Скопируй этот код и отправь другому человеку. Он сможет импортировать твой текущий забег и мета-прогрессию.</p><textarea id="shareOut" style="width:100%;height:150px;background:#080d17;border:1px solid #33415d;color:white;border-radius:10px;padding:10px;resize:vertical">${code}</textarea><button class="btn goodBtn" onclick="navigator.clipboard?.writeText(document.getElementById('shareOut').value).then(()=>toast('Код скопирован')).catch(()=>toast('Выдели код и скопируй вручную'))">📋 Скопировать код</button><button class="btn" onclick="closeModal()">Закрыть</button>`);
  setTimeout(()=>document.getElementById('shareOut')?.select(),0);
}
function importShare(){
  openModal(`<h2>📥 Получить игру</h2><p class="small muted">Вставь код, который тебе отправил другой игрок.</p><textarea id="shareIn" style="width:100%;height:150px;background:#080d17;border:1px solid #33415d;color:white;border-radius:10px;padding:10px;resize:vertical" placeholder="Вставь код сюда"></textarea><button class="btn primary" onclick="applyShare(document.getElementById('shareIn').value)">▶️ Загрузить игру</button><button class="btn" onclick="closeModal()">Отмена</button>`);
}
function applyShare(code){
  try{
    const d=decodeShareData(code);
    if(!d||d.v!==1||!d.run||!d.meta)throw new Error('bad share');
    S=d.run;
    restoreSavedEvent();
    META=d.meta;
    metaSave(META);
    save();
    R=RNG(S.seed||'boot');
    if(S.p)recomputeBuild();
    closeModal();
    render();
    toast('Игра загружена');
  }catch(e){toast('Неверный или повреждённый код')}
}

/* ---------- Android/WebView touch activation ---------- */
/* Native click dispatch can be unreliable in some Android WebViews.
   For a real tap on a button, invoke its existing inline action directly.
   No game logic is changed; this only normalizes touch delivery. */
(function(){
  let touchButton=null, startX=0, startY=0, moved=false;
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){touchButton=null;return}
    const t=e.touches[0], el=t.target.closest && t.target.closest('button');
    touchButton=el||null; startX=t.clientX; startY=t.clientY; moved=false;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!touchButton||!e.touches.length)return;
    const t=e.touches[0];
    if(Math.abs(t.clientX-startX)>10||Math.abs(t.clientY-startY)>10)moved=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    const el=touchButton; touchButton=null;
    if(!el||moved||el.disabled)return;
    if(!el.isConnected)return;
    e.preventDefault();
    e.stopPropagation();
    if(typeof el.onclick==='function') el.onclick();
  },{passive:false});
})();

const DLC_ID='abyss-awakening';

function dlcUnlocked(){

function setDlcUnlocked(code){
  ensureMeta();
  META.dlc=META.dlc||{};

async function activateDlc(code){
  code=String(code||'').trim();
  if(!code){toast('Введи код активации.');return}
  const b=document.querySelector('#modalBack .primary');
  if(b){b.disabled=true;b.textContent='⏳ Проверка...'}
  try{
    const r=await fetch(DLC_API+'/api/activate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.valid&&d.dlc_id===DLC_ID){
      setDlcUnlocked(code);
      awardAchievement('dlcAwakened');
      closeModal();
      toast('🌑 DLC «Пробуждение Бездны» активировано!');
      render();
    }else{
      toast(d.error||'Код недействителен или покупка не подтверждена.');
      if(b){b.disabled=false;b.textContent='🔓 Активировать DLC'}
    }
  }catch(e){
    toast('Не удалось связаться с сервером активации. Проверь интернет и попробуй снова.');
    if(b){b.disabled=false;b.textContent='🔓 Активировать DLC'}
  }
}

  {id:'voidMantle',name:'Мантия Пустоты',slot:'armor',rarity:'legendary',def:3,magic:10,desc:'+10 MAGIC, +3 DEF; каждый третий ход +3 MP.',dlc:DLC_ID,turnMana:3},
  {id:'awakeningAmulet',name:'Амулет Пробуждения',slot:'accessory',rarity:'epic',tags:['heal','risk'],hp:10,desc:'+10 max HP; лечение навыками +20%.',dlc:DLC_ID,healMul:.20},
  {id:'echoRing',name:'Кольцо Эха',slot:'accessory',rarity:'rare',tags:['combo','magic'],magic:4,desc:'+4 MAGIC; каждый навык с 2+ комбо возвращает 1 MP.',dlc:DLC_ID,echoMp:1},
  {id:'riftBoots',name:'Сапоги Разлома',slot:'accessory',rarity:'rare',tags:['risk','combo'],crit:.05,desc:'+5% CRIT; первый навык в бою наносит +20% урона.',dlc:DLC_ID,firstSkill:.20},
  {id:'abyssCore',name:'Ядро Пробуждения',slot:'accessory',rarity:'legendary',tags:['magic','risk','summon'],magic:7,atk:3,desc:'+3 ATK, +7 MAGIC; при победе над элитой +5% max HP до конца забега.',dlc:DLC_ID,eliteHp:.05}
];
ITEMS.push(...DLC_ITEMS);
const DLC_RELICS=[
  {id:'riftHeart',name:'Сердце Разлома',rarity:'epic',tags:['magic','risk'],desc:'Навыки наносят +12% урона, но их стоимость MP +1.',dlc:DLC_ID},
  {id:'echoCrown',name:'Корона Эха',rarity:'legendary',tags:['combo','magic'],desc:'При комбо 5+ каждый навык получает +25% урона.',dlc:DLC_ID},
  {id:'voidEye',name:'Око Пробуждения',rarity:'legendary',tags:['risk','heal'],desc:'Один раз за бой при HP ≤25% полностью снимает один негативный статус и лечит 18% max HP.',dlc:DLC_ID},
  {id:'fractureShard',name:'Осколок Трещины',rarity:'rare',tags:['bleed','risk'],desc:'Криты по кровоточащим целям добавляют 1 кровотечение.',dlc:DLC_ID},
  {id:'abyssLantern',name:'Фонарь Бездны',rarity:'rare',tags:['magic','burn','poison'],desc:'Каждый первый негативный эффект на враге в бою получает +1 ход.',dlc:DLC_ID},
  {id:'echoStone',name:'Камень Эха',rarity:'epic',tags:['combo','heal'],desc:'При комбо 4+ каждый третий навык лечит 4% max HP.',dlc:DLC_ID},
  {id:'voidAnchor',name:'Якорь Пустоты',rarity:'epic',tags:['defense','risk'],desc:'Когда блок поглощает удар полностью, получаешь +2 MP.',dlc:DLC_ID},
  {id:'awakeningSeal',name:'Печать Пробуждения',rarity:'legendary',tags:['magic','combo','risk'],desc:'За каждый активный статус на враге +6% урона навыков, максимум +30%.',dlc:DLC_ID}
];
RELICS.push(...DLC_RELICS);
const DLC_ENEMIES=[
  {id:'riftStalker',name:'Сталкер Разлома',hp:82,atk:17,def:4,gold:48,pattern:['attack','slow','crit'],dlc:DLC_ID},
  {id:'voidSeer',name:'Провидец Пустоты',hp:76,atk:15,def:5,gold:52,pattern:['burn','poison','heal'],dlc:DLC_ID},
  {id:'echoDevourer',name:'Пожиратель Эха',hp:105,atk:18,def:6,gold:65,pattern:['block','stun','attack'],dlc:DLC_ID}
];
ENEMIES.push(...DLC_ENEMIES);
const DLC_BOSS={id:'awakeningAvatar',name:'Аватар Пробуждения',hp:330,atk:27,def:9,gold:240,phases:3,skills:['special','burn','crit','heal'],dlc:DLC_ID};
BOSSES.push(DLC_BOSS);
const DLC_EVENTS=[
  {name:'Сломанный портал',desc:'Разлом предлагает короткий путь за часть жизненной силы.',actions:[['🕳️ -15 HP → +100 золота',()=>{S.p.hp=Math.max(1,S.p.hp-15);S.gold+=100;addLog('🕳️ Портал отдал тебе золото.','good')}],['🌌 -10 max HP → редкая реликвия',()=>{S.p.max=Math.max(1,S.p.max-10);S.p.hp=Math.min(S.p.hp,S.p.max);giveRelic('rare')}],['🚪 Уйти',()=>{}]],dlc:DLC_ID},
  {name:'Хор Эха',desc:'Голоса обещают силу, если ты выдержишь их ритм.',actions:[['⚡ +3 комбо → -8 HP',()=>{S.p.combo=Math.min(9,S.p.combo+3);S.p.hp=Math.max(1,S.p.hp-8)}],['💧 +12 MP → получить проклятие',()=>{S.p.mp=Math.min(S.p.maxmp,S.p.mp+12);addCurse()}],['🚪 Уйти',()=>{}]],dlc:DLC_ID},
  {name:'Око Пустоты',desc:'Оно показывает один возможный исход твоего похода.',actions:[['👁️ Увидеть силу → +15% ATK на текущий бой',()=>{S.p.tempDlcAtk=.15;addLog('👁️ Око усилило следующий бой.','good')}],['💎 Заплатить 30 золота → легендарная реликвия',()=>{if(S.gold>=30){S.gold-=30;giveRelic('legendary')}else toast('Не хватает золота.')}],['🚪 Уйти',()=>{}]],dlc:DLC_ID},
  {name:'Кузница Трещин',desc:'Металл здесь помнит удары тех, кто прошёл Бездну.',actions:[['🔨 Улучшить случайный предмет',()=>{const i=R.int(S.inventory.length);if(S.inventory.length)forgeItem(i);else toast('Нет предметов.')}],['🔥 Обменять 15 HP на 40 золота',()=>{S.p.hp=Math.max(1,S.p.hp-15);S.gold+=40}],['🚪 Уйти',()=>{}]],dlc:DLC_ID},
  {name:'Последнее пробуждение',desc:'Бездны становится больше, но и ты меняешься вместе с ней.',actions:[['🌑 +20 max HP → +1 проклятие',()=>{S.p.max+=20;S.p.hp=Math.min(S.p.max,S.p.hp+20);addCurse()}],['⚔️ +2 ATK → -20 max HP',()=>{S.p.atk+=2;S.p.max=Math.max(1,S.p.max-20);S.p.hp=Math.min(S.p.hp,S.p.max)}],['🚪 Уйти',()=>{}]],dlc:DLC_ID}
];
EVENTS.push(...DLC_EVENTS);
Object.assign(ACHIEVEMENTS,{dlcAwakened:{name:'Пробуждение',desc:'Активировать DLC «Пробуждение Бездны».',pts:20,dlc:DLC_ID},dlcClass:{name:'Новая грань',desc:'Завершить забег Пробуждённым.',pts:35,dlc:DLC_ID},dlcBoss:{name:'Лик Пробуждения',desc:'Победить Аватара Пробуждения.',pts:45,dlc:DLC_ID},dlcBuild:{name:'Эхо и разлом',desc:'Завершить забег с активной синергией DLC.',pts:30,dlc:DLC_ID},dlcCollector:{name:'Архив пробуждения',desc:'Собрать 5 разных предметов или реликвий DLC.',pts:40,dlc:DLC_ID}});
CODEX_ENEMIES.push(...DLC_ENEMIES,DLC_BOSS);

const BASE_DLC_GIVE_RELIC=giveRelic;
giveRelic=function(rarity){if(dlcUnlocked())return BASE_DLC_GIVE_RELIC(rarity);const original=RELICS.slice();for(let i=RELICS.length-1;i>=0;i--)if(RELICS[i].dlc===DLC_ID)RELICS.splice(i,1);try{return BASE_DLC_GIVE_RELIC(rarity)}finally{RELICS.splice(0,RELICS.length,...original)}};
const BASE_DLC_START_COMBAT=startCombat;
startCombat=function(elite=false){const original=ENEMIES.slice();if(!dlcUnlocked())for(let i=ENEMIES.length-1;i>=0;i--)if(ENEMIES[i].dlc===DLC_ID)ENEMIES.splice(i,1);try{return BASE_DLC_START_COMBAT(elite)}finally{ENEMIES.splice(0,ENEMIES.length,...original)}};
const BASE_DLC_START_BOSS=startBoss;
startBoss=function(){const original=BOSSES.slice();if(!dlcUnlocked())for(let i=BOSSES.length-1;i>=0;i--)if(BOSSES[i].dlc===DLC_ID)BOSSES.splice(i,1);try{return BASE_DLC_START_BOSS()}finally{BOSSES.splice(0,BOSSES.length,...original)}};
const BASE_DLC_MAKE_REWARDS=makeRewards;
makeRewards=function(count){const oi=ITEMS.slice(),or=RELICS.slice();if(!dlcUnlocked()){for(let i=ITEMS.length-1;i>=0;i--)if(ITEMS[i].dlc===DLC_ID)ITEMS.splice(i,1);for(let i=RELICS.length-1;i>=0;i--)if(RELICS[i].dlc===DLC_ID)RELICS.splice(i,1)}try{return BASE_DLC_MAKE_REWARDS(count)}finally{ITEMS.splice(0,ITEMS.length,...oi);RELICS.splice(0,RELICS.length,...or)}};
const BASE_DLC_ENTER_NODE=enterNode;
enterNode=function(n){const oe=EVENTS.slice();if(!dlcUnlocked())for(let i=EVENTS.length-1;i>=0;i--)if(EVENTS[i].dlc===DLC_ID)EVENTS.splice(i,1);try{return BASE_DLC_ENTER_NODE(n)}finally{EVENTS.splice(0,EVENTS.length,...oe)}};

const BASE_DLC_START_RUN=startRun;
startRun=function(cls,asc,seed,subclass='auto',loadout='none',modifier='normal'){if(CLASSES[cls]?.dlc===DLC_ID&&!dlcUnlocked()){openDlcActivation();return}BASE_DLC_START_RUN(cls,asc,seed,subclass,loadout,modifier);const sub=SUBCLASSES[cls]?.[S.profile?.subclass];if(sub?.bonus?.crit&&S.p)S.p.crit+=sub.bonus.crit;if(S.p)S.p.dlcFirstSkillUsed=false;recomputeBuild();save();render()};

const BASE_DLC_APPLY_ITEM=applyItem;
applyItem=function(it){BASE_DLC_APPLY_ITEM(it);if(it?.dlc===DLC_ID&&it.hp&&S.p){const m=RARITY[it.rarity]?.mul||1,hp=Math.round(it.hp*m);S.p.max+=hp;S.p.hp+=hp;it.__bonus=it.__bonus||{};it.__bonus.hp=hp}};
const BASE_DLC_SCRAP_ITEM=scrapItem;
scrapItem=function(i){const it=S.inventory[i];if(!it)return;const hp=it.__bonus?.hp||0;BASE_DLC_SCRAP_ITEM(i);if(hp&&S.p){S.p.max=Math.max(1,S.p.max-hp);S.p.hp=Math.min(S.p.hp,S.p.max)}save()};

const BASE_DLC_USE_SKILL=useSkill;
useSkill=function(id){const sk=SKILLS[id];if(!sk||sk.dlc!==DLC_ID)return BASE_DLC_USE_SKILL(id);if(!dlcUnlocked()){toast('Этот контент доступен после активации DLC.');return}if(!canAct())return;const p=S.p,e=enemy(),effectiveCost=sk.cost+(hasRelic('riftHeart')?1:0);if(p.mp<effectiveCost){toast('Недостаточно MP');return}p.mp-=effectiveCost;let d=0,skillBonus=1;if(id==='rift'){d=dmgCalc(p,e,sk.base,true)*skillBonus;dealPlayerDamage(Math.floor(d),'Разлом');addStatus(e,'slow',2)}else if(id==='voidpulse'){d=dmgCalc(p,e,sk.base,true)*skillBonus;dealPlayerDamage(Math.floor(d),'Импульс Бездны');const st=R.pick(['burn','poison','bleed']);addStatus(e,st,3+(st==='burn'&&hasItem('voidstaff')?1:0));if(hasRelic('abyssLantern'))addStatus(e,st,4)}else if(id==='echo'){for(let i=0;i<2;i++){d=dmgCalc(p,e,sk.base,true)*skillBonus;if(p.combo>=5&&hasRelic('echoCrown'))d*=1.25;dealPlayerDamage(Math.floor(d),'Эхо Бездны');if(e.hp<=0)break}p.combo=Math.min(9,p.combo+2);p.mp=Math.min(p.maxmp,p.mp+2+(hasItem('echoRing')?1:0))}else if(id==='devour'){d=dmgCalc(p,e,sk.base)*skillBonus;dealPlayerDamage(Math.floor(d),'Поглощение');const healed=Math.floor(Math.max(0,d)*.15*(1+(hasItem('awakeningAmulet')?.20:0)));if(healed>0)heal(healed)}else if(id==='collapse'){d=dmgCalc(p,e,sk.base,true)*skillBonus;if((e.statuses||[]).length)d*=1.30;if(hasRelic('awakeningSeal'))d*=1+Math.min(.30,(e.statuses||[]).length*.06);if(p.combo>=5&&hasRelic('echoCrown'))d*=1.25;dealPlayerDamage(Math.floor(d),'Схлопывание');p.hp=Math.max(1,p.hp-Math.ceil(p.max*.06))}if(hasItem('riftBoots'))p.dlcFirstSkillUsed=true;if(e.hp>0)endPlayerTurn();else winCombat()};

const BASE_DLC_DMG_CALC=dmgCalc;
dmgCalc=function(att,def,mult=1,magic=false){let d=BASE_DLC_DMG_CALC(att,def,mult,magic);if(att===S.p&&dlcUnlocked()){if(magic){if(hasItem('riftblade'))d*=1.05;if(hasRelic('riftHeart'))d*=1.12;if(hasRelic('echoCrown')&&S.p.combo>=5)d*=1.25;if(hasRelic('awakeningSeal'))d*=1+Math.min(.30,(def.statuses||[]).length*.06)}if(S.p.tempDlcAtk){d*=1+S.p.tempDlcAtk;S.p.tempDlcAtk=0}if(hasItem('echoDagger')&&S.p.combo>=5)d*=1.10;if(hasItem('riftBoots')&&!S.p.dlcFirstSkillUsed)d*=1.20}return Math.max(1,Math.floor(d))};
const BASE_DLC_END_TURN=endPlayerTurn;
endPlayerTurn=function(){BASE_DLC_END_TURN();if(dlcUnlocked()&&S.screen==='combat'&&S.p){if(hasItem('voidMantle')&&S.combat.turn%3===0)S.p.mp=Math.min(S.p.maxmp,S.p.mp+3);if(hasItem('echoRing')&&S.p.combo>=2)S.p.mp=Math.min(S.p.maxmp,S.p.mp+1);if(hasRelic('echoStone')&&S.p.combo>=4&&S.combat.turn%3===0)heal(Math.floor(S.p.max*.04))}};
const BASE_DLC_WIN_COMBAT=winCombat;
winCombat=function(){const wasDlcEnemy=!!enemy()?.dlc;const beforeInventory=(S.inventory||[]).filter(x=>x.dlc===DLC_ID).length;BASE_DLC_WIN_COMBAT();if(dlcUnlocked()&&wasDlcEnemy){addLog('🌑 Победа над врагом DLC.','good');if(hasItem('abyssCore')&&enemy()?.elite){S.p.max=Math.floor(S.p.max*1.05);S.p.hp=Math.min(S.p.max,S.p.hp+5)}}if(dlcUnlocked()&&beforeInventory>=5)awardAchievement('dlcCollector')};
const BASE_DLC_SET_INTENT=setIntent;
setIntent=function(){const e=enemy();if(e?.id==='awakeningAvatar'&&dlcUnlocked()){const pool=e.phase===1?['attack','special','burn']:e.phase===2?['crit','special','heal']:['special','crit','burn','attack'];e.intent=R.pick(pool);return}BASE_DLC_SET_INTENT()};

const BASE_DLC_EXPANDED_CITY=expandedCityScreen;
expandedCityScreen=function(){const h=BASE_DLC_EXPANDED_CITY();const box=dlcUnlocked()?`<div class="card"><h2>🌑 Пробуждение Бездны</h2><div class="cityStatus good">✓ DLC активно</div><button class="btn" onclick="setScreen('start');render()">🌑 Начать забег Пробуждённым</button></div>`:`<div class="card"><h2>🌑 Пробуждение Бездны</h2><div class="cityStatus">Платное DLC • ${DLC_PRICE_RUB} ₽</div><button class="btn primary" onclick="openDlcActivation()">🔓 Купить / активировать DLC</button><div class="small muted">Новый класс, подклассы, навыки, предметы, реликвии, враги, босс, события, достижения и записи кодекса.</div></div>`;return h+box};
const BASE_DLC_START_SCREEN=startScreen;
startScreen=function(){const h=BASE_DLC_START_SCREEN();const extra=dlcUnlocked()?`<div class="card"><h2>🌑 DLC: Пробуждение Бездны</h2><div class="cityStatus good">✓ Активировано</div><button class="btn primary" onclick="openStart('awakened')">🌑 Выбрать Пробуждённого</button></div>`:`<div class="card"><h2>🌑 DLC: Пробуждение Бездны</h2><div class="cityStatus">🔒 Заблокировано • ${DLC_PRICE_RUB} ₽</div><button class="btn" onclick="openDlcActivation()">🔓 Купить / активировать</button></div>`;return h+extra};
const BASE_DLC_OPEN_START=openStart;
openStart=function(cls){if(CLASSES[cls]?.dlc===DLC_ID&&!dlcUnlocked()){openDlcActivation();return}return BASE_DLC_OPEN_START(cls)};
const BASE_DLC_END_SCREEN=endScreen;
endScreen=function(win){const h=BASE_DLC_END_SCREEN(win);if(dlcUnlocked()&&win&&S.cls==='awakened'){if((SYNERGIES||[]).some(x=>tagCount(x.tag)>=x.need&&['magic','combo','risk'].includes(x.tag)))awardAchievement('dlcBuild');if(S.inventory.filter(x=>x.dlc===DLC_ID).length+S.relics.filter(x=>x.dlc===DLC_ID).length>=5)awardAchievement('dlcCollector');awardAchievement('dlcClass')}return h};
const BASE_DLC_CODEX=codexScreen;
codexScreen=function(){if(dlcUnlocked())return BASE_DLC_CODEX();const original=CODEX_ENEMIES.slice();for(let i=CODEX_ENEMIES.length-1;i>=0;i--)if(CODEX_ENEMIES[i].dlc===DLC_ID)CODEX_ENEMIES.splice(i,1);let h;try{h=BASE_DLC_CODEX()}finally{CODEX_ENEMIES.splice(0,CODEX_ENEMIES.length,...original)}return h+`<div class="card"><h2>🌑 Пробуждение Бездны</h2><div class="cityStatus">🔒 Записи DLC скрыты до активации.</div><button class="btn" onclick="openDlcActivation()">🔓 Активировать DLC</button></div>`};

</script></body></html>
