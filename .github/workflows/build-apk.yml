name: Build Chronicles Of The Abyss APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare HTML game asset
        run: |
          mkdir -p app/src/main/assets
          cp game.html app/src/main/assets/game.html

      - name: Build debug APK (always available)
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare debug APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChroniclesOfTheAbyss-test.apk
          sha256sum ChroniclesOfTheAbyss-test.apk > ChroniclesOfTheAbyss-test.apk.sha256

      - name: Verify debug APK
        run: |
          test -s ChroniclesOfTheAbyss-test.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose ChroniclesOfTheAbyss-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Test
          path: |
            ChroniclesOfTheAbyss-test.apk
            ChroniclesOfTheAbyss-test.apk.sha256
          if-no-files-found: error

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify and prepare signed release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChroniclesOfTheAbyss.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose ChroniclesOfTheAbyss.apk
          sha256sum ChroniclesOfTheAbyss.apk > ChroniclesOfTheAbyss.apk.sha256

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Release
          path: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256
          if-no-files-found: error
