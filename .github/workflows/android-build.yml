name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Checkout current game source
        uses: actions/checkout@v4
        with:
          repository: demin6632-del/chronicles-of-the-abyss
          ref: main
          path: game-source

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Prepare current game asset
        run: |
          test -s game-source/game.html
          mkdir -p app/src/main/assets
          cp game-source/game.html app/src/main/assets/game.html
          wc -c app/src/main/assets/game.html

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK exists and is valid
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Android project archive
        run: |
          rm -rf game-source
          rm -rf .git
          zip -r ChroniclesOfTheAbyss_ANDROID_READY.zip . -x 'app/build/*' '.gradle/*'

      - name: Upload Android project archive
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Android-Project
          path: ChroniclesOfTheAbyss_ANDROID_READY.zip
          if-no-files-found: error
