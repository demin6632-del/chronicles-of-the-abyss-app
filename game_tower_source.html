<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b14"><title>Хроники Бездны — Покорение Башни</title><style>body{margin:0;background:#080b14;color:#eef2ff;font-family:system-ui,sans-serif}#app{max-width:520px;margin:auto;padding:12px}.card{background:#111827;border:1px solid #26334d;border-radius:15px;padding:13px;margin-bottom:10px}.btn{width:100%;padding:11px;margin:5px 0;background:#182238;color:white;border:1px solid #30405f;border-radius:12px;font-weight:700}.primary{background:#39266b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{padding:12px;border:1px solid #26334d;border-radius:12px;background:#0c1421;color:white;margin:7px 0;width:100%;text-align:left}.choice.active{border-color:#8b5cf6}input{width:100%;box-sizing:border-box;padding:11px;background:#080d17;color:white;border:1px solid #33415d;border-radius:10px}.muted{color:#8d99b5}.good{color:#35d07f}.bad{color:#ff5577}.gold{color:#f6c453}.tower{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.floor{min-height:60px;border:1px solid #26334d;border-radius:10px;background:#101827;padding:6px;text-align:center;font-size:10px}.current{outline:2px solid #f6c453}.done{border-color:#2c6d4b}.boss{border-color:#a63f57;background:#28131b}.fight{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fighter{background:#0c1320;border:1px solid #26334d;border-radius:14px;padding:10px}.bar{height:9px;background:#070a10;border:1px solid #26334d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#35d07f}.hp i{background:#e64b69}.mp i{background:#4d9dff}.item{padding:10px;border:1px solid #26334d;border-radius:11px;background:#0c1421;margin:5px 0}.log{font-size:12px;padding:8px;border-left:3px solid #34415b;background:#0b111d;border-radius:8px;margin:4px 0}.log.good{border-left-color:#35d07f}.log.combat{border-left-color:#ff5577}footer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;padding:7px;background:rgba(7,10,17,.97);border-top:1px solid #26334d}.notice{padding:10px;border-radius:10px;background:#121c30;border:1px solid #30405f}</style></head><body><div id="app"></div><script>'use strict';const KEY='chronicles_tower_save_v3';const C={warrior:{name:'Воин',icon:'⚔️',hp:130,mp:40,atk:13,def:8,desc:'Сильный фронтовик.',skills:[['heavy','Тяжёлый удар','1.7× урон'],['guard','Стойка','сильная защита'],['rage','Ярость','2.1× урон']]},mage:{name:'Маг',icon:'🔮',hp:88,mp:75,atk:16,def:3,desc:'Мастер стихий.',skills:[['fire','Огненный шар','1.9× + горение'],['frost','Ледяной импульс','1.45× + оглушение'],['storm','Грозовой разряд','2.2× урон']]},rogue:{name:'Разбойник',icon:'🗡️',hp:100,mp:48,atk:15,def:4,desc:'Криты, яд и серии ударов.',skills:[['flurry','Шквал','2 удара'],['venom','Отравленный выпад','1.3× + яд'],['shadow','Теневой рывок','2.0×']]},paladin:{name:'Паладин',icon:'🛡️',hp:145,mp:45,atk:12,def:10,desc:'Защитник Башни.',skills:[['heavy','Карательный удар','1.65×'],['guard','Святая стойка','защита'],['heal','Свет Бездны','лечение']]},warlock:{name:'Чернокнижник',icon:'🜏',hp:94,mp:78,atk:14,def:3,desc:'Тёмная магия.',skills:[['fire','Пламя Пустоты','1.95×'],['venom','Порча','1.35× + яд'],['shadow','Теневой разлом','2.1×']]},ranger:{name:'Следопыт',icon:'🏹',hp:108,mp:55,atk:16,def:4,desc:'Точный стрелок.',skills:[['flurry','Залп','2 удара'],['venom','Отравленная стрела','1.35× + яд'],['shadow','Выстрел из тени','2.0×']]}};const W=[{name:'Старый меч',type:'weapon',atk:3,def:0},{name:'Клинок Предела',type:'weapon',atk:7,def:0},{name:'Рунический посох',type:'weapon',atk:9,def:0},{name:'Клинки Тени',type:'weapon',atk:8,def:1},{name:'Молот Хранителя',type:'weapon',atk:10,def:2},{name:'Лук Вершины',type:'weapon',atk:11,def:0},{name:'Меч Сердца Бездны',type:'weapon',atk:16,def:2}];const A=[{name:'Походная одежда',type:'armor',atk:0,def:2},{name:'Кольчуга Предела',type:'armor',atk:0,def:6},{name:'Мантия Архимага',type:'armor',atk:2,def:5},{name:'Доспех Хранителя',type:'armor',atk:0,def:10},{name:'Плащ Тени',type:'armor',atk:3,def:6},{name:'Броня Сердца Бездны',type:'armor',atk:4,def:14}];const B={10:['Хранитель Первой Печати',230,22,10],20:['Архонт Пустоты',360,29,13],30:['Пожиратель Башен',520,36,16],40:['Безымянный Владыка',720,44,20],50:['Сердце Бездны',1000,52,24]};const Q=[{floor:10,name:'Первая печать',reward:150},{floor:20,name:'Вторая печать',reward:250},{floor:30,name:'Глубже тьмы',reward:400},{floor:40,name:'Предел смертных',reward:650},{floor:50,name:'Сердце Башни',reward:1000}];const E=['Порождение Бездны','Костяной страж','Теневой охотник','Осквернённый маг','Пожиратель света','Рыцарь Пустоты'];let S={hero:null,floor:1,screen:'home',enemy:null,block:0,logs:[],inventory:[],quests:Q.map(q=>({...q,done:false}))};let selected='warrior';function save(){localStorage.setItem(KEY,JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.hero){S=x;return true}}catch(e){}return false}function cls(){return C[S.hero.cls]}function hpmax(){return S.hero.baseHp+S.hero.level*8+S.inventory.filter(x=>x.equipped&&x.type==='armor').reduce((a,x)=>a+x.def*2,0)}function atk(){return S.hero.baseAtk+Math.floor(S.hero.level*1.4)+S.inventory.filter(x=>x.equipped).reduce((a,x)=>a+(x.atk||0),0)}function df(){return S.hero.baseDef+Math.floor(S.hero.level*.7)+S.inventory.filter(x=>x.equipped).reduce((a,x)=>a+(x.def||0),0)}function need(){return 80+S.hero.level*45}function lg(t,type=''){S.logs.push({t,type});S.logs=S.logs.slice(-12)}function initHero(n,c){let d=C[c];S.hero={name:n||'Герой',cls:c,level:1,xp:0,gold:40,baseHp:d.hp,baseAtk:d.atk,baseDef:d.def,hp:d.hp,mp:d.mp,maxMp:d.mp,potions:3,skillPoints:0};S.floor=1;S.inventory=[{...W[0],id:'startw',equipped:true},{...A[0],id:'starta',equipped:true}];S.quests=Q.map(q=>({...q}));S.logs=[];lg('Ты входишь в Башню Бездны. Один герой. Один путь наверх.','good');save()}function heal(){S.hero.hp=hpmax();S.hero.mp=S.hero.maxMp}function xp(n){S.hero.xp+=n;while(S.hero.xp>=need()){S.hero.xp-=need();S.hero.level++;S.hero.skillPoints++;S.hero.maxMp+=3;heal();lg('Новый уровень: '+S.hero.level+'!','good')}}function header(){if(!S.hero)return '<header class="card"><b>♆ Хроники Бездны</b><div class="muted">Покорение Башни • постоянный герой</div></header>';let h=S.hero;return `<header class="card"><div><b>${cls().icon} ${h.name}</b><div class="muted">${cls().name} • Этаж ${S.floor}</div></div><div class="grid2"><div>❤️ ${Math.ceil(h.hp)}/${hpmax()}</div><div>💧 ${h.mp}/${h.maxMp}</div><div>🪙 ${h.gold}</div><div>⭐ ${h.level}</div></div></header>`}function home(){return '<div class="card"><h1>♆ Хроники Бездны</h1><div class="notice"><b>Покорение Башни</b><br><span class="muted">Непрерывное приключение одного героя. Забегов нет.</span></div><button class="btn primary" onclick="newHero()">⚔️ Начать покорение</button><button class="btn" onclick="continueGame()">📜 Продолжить игру</button></div><div class="card"><b>В игре</b><br><span class="muted">6 классов • оружие • броня • 50 этажей • 5 боссов • квесты • уровни • зелья • сохранение.</span></div>'}function newHero(){S.screen='create';render()}function create(){return `<div class="card"><h1>Создание героя</h1><input id="heroName" value="Герой Бездны" maxlength="24"><h2>Класс</h2>${Object.entries(C).map(([id,c])=>`<button class="choice ${id===selected?'active':''}" onclick="pick('${id}')"><b>${c.icon} ${c.name}</b><br><span class="muted">${c.desc}</span><br>❤️ ${c.hp} • ⚔️ ${c.atk} • 🛡️ ${c.def} • 💧 ${c.mp}</button>`).join('')}<button class="btn primary" onclick="start()">Начать путь</button></div>`}function pick(c){selected=c;render()}function start(){initHero(document.getElementById('heroName').value.trim(),selected);S.screen='tower';render()}function continueGame(){if(load()){S.screen='tower';render()}else{S.screen='create';render()}}function tower(){let a=Math.max(1,S.floor-2),z=Math.min(50,S.floor+7);return `<div class="card"><h2>🏰 Башня Бездны</h2><div class="muted">Постоянный прогресс. Пройденные этажи не сбрасываются.</div><div class="tower">${Array.from({length:z-a+1},(_,i)=>a+i).map(f=>`<div class="floor ${f<S.floor?'done':''} ${f===S.floor?'current':''} ${B[f]?'boss':''}"><b>${f}</b><br>${B[f]?'👑 Босс':'Этаж'}</div>`).join('')}</div><div class="grid2"><button class="btn primary" onclick="enter()">⬆️ Этаж ${S.floor}</button><button class="btn" onclick="rest()">🔥 Отдохнуть</button></div></div><div class="card"><h3>📜 Квесты</h3>${S.quests.map(q=>`<div class="item"><b>${q.done?'✅':'📜'} ${q.name}</b><div class="muted small">Победить босса ${q.floor} этажа • награда ${q.reward} 🪙</div></div>`).join('')}</div><div class="card"><h3>📖 Хроника</h3>${S.logs.slice(-6).map(x=>`<div class="log ${x.type}">${x.t}</div>`).join('')}</div>`}function enter(){let f=S.floor;if(f>50){S.screen='victory';render();return}let e;if(B[f]){let b=B[f],m=b[1]+S.hero.level*8;e={name:b[0],hp:m,max:m,atk:b[2],def:b[3],boss:true}}else{let m=55+f*8+S.hero.level*6;e={name:E[(f*7+S.hero.level)%E.length],hp:m,max:m,atk:8+Math.floor(f*.65),def:2+Math.floor(f/7),boss:false}}S.enemy=e;S.block=0;S.screen='combat';lg((e.boss?'👑 Босс: ':'⚔️ Враг: ')+e.name,'combat');render()}function pd(m=1){return Math.max(1,Math.floor(atk()*m*(Math.random()<.12?1.7:1)))}function enemy(){let e=S.enemy,d=Math.max(1,e.atk+Math.floor(Math.random()*5)-df()-S.block);S.block=0;S.hero.hp-=d;lg(e.name+' наносит '+d+' урона.','combat');if(S.hero.hp<=0){S.hero.hp=1;S.floor=Math.max(1,S.floor-1);heal();S.enemy=null;S.screen='tower';lg('Герой пал, но путь продолжается. Возвращение на предыдущий этаж.','bad');save();render()}}function act(k,id){if(!S.enemy)return;let h=S.hero,e=S.enemy;if(k==='attack'){let d=Math.max(1,pd()-e.def);e.hp-=d;lg('Ты наносишь '+d+' урона.','combat')}else if(k==='defend'){S.block=10+df();lg('Ты принимаешь защитную стойку.','good')}else if(k==='potion'){if(h.potions<=0)return;h.potions--;let v=Math.floor(hpmax()*.32);h.hp=Math.min(hpmax(),h.hp+v);lg('Зелье восстановило '+v+' HP.','good')}else{let s=cls().skills.find(x=>x[0]===id);if(!s)return;let cost=id==='guard'?7:id==='heal'?10:9;if(h.mp<cost)return;h.mp-=cost;if(id==='guard'){S.block=22+df()}else if(id==='heal'){h.hp=Math.min(hpmax(),h.hp+Math.floor(hpmax()*.28))}else if(id==='flurry'){e.hp-=Math.max(1,pd(.85)-e.def)+Math.max(1,pd(.85)-e.def)}else{let m=id==='fire'?1.9:id==='frost'?1.45:id==='storm'?2.2:id==='heavy'?1.7:id==='rage'?2.1:id==='venom'?1.3:2;e.hp-=Math.max(1,pd(m)-e.def);if(id==='fire')e.burn=3;if(id==='venom')e.poison=3;if(id==='frost'&&Math.random()<.35)e.stun=1}}if(e.poison&&e.hp>0)e.hp-=4;if(e.burn&&e.hp>0)e.hp-=5;if(e.hp<=0){win();return}if(!e.stun)enemy();else e.stun=0;save();render()}function win(){let f=S.floor,e=S.enemy,x=35+f*8+(e.boss?80:0),g=18+f*3+(e.boss?120:0);xp(x);S.hero.gold+=g;if(e.boss){let q=S.quests.find(q=>q.floor===f);if(q&&!q.done){q.done=true;S.hero.gold+=q.reward;lg('Квест выполнен: '+q.name+'.','good')}}lg('Победа! +'+x+' XP, +'+g+' 🪙.','good');if(f<50){S.floor++;heal();let d=f>=45?{...W[6]}:f>=30?{...A[4]}:f>=20?{...W[4]}:f%5===0?{...W[1]}:null;if(d){d.id='loot'+Date.now();d.equipped=false;S.inventory.push(d);lg('Найдена экипировка: '+d.name+'!','good')}}else{S.floor=51;S.screen='victory'}S.enemy=null;save();render()}function rest(){let c=8+S.floor;if(S.hero.gold<c)lg('Недостаточно золота.','bad');else{S.hero.gold-=c;heal();lg('Отдых восстановил силы.','good')}save();render()}function combat(){let h=S.hero,e=S.enemy;return `<div class="card"><div class="fight"><div class="fighter"><b>${cls().icon} ${h.name}</b><div>❤️ ${Math.ceil(h.hp)}/${hpmax()}</div><div>💧 ${h.mp}/${h.maxMp}</div><div>⚔️ ${atk()} • 🛡️ ${df()}</div></div><div class="fighter"><b>${e.boss?'👑':'👹'} ${e.name}</b><div>❤️ ${Math.max(0,e.hp)}/${e.max}</div><div class="muted">Атака ${e.atk} • Защита ${e.def}</div></div></div></div><div class="card"><button class="btn primary" onclick="act('attack')">⚔️ Атаковать</button><button class="btn" onclick="act('defend')">🛡️ Защищаться</button><button class="btn" onclick="act('potion')">🧪 Зелье (${h.potions})</button><div class="grid2">${cls().skills.map(s=>`<button class="btn" onclick="act('skill','${s[0]}')">${s[1]}<br><span class="muted">${s[2]}</span></button>`).join('')}</div></div><div class="card"><h3>📖 Бой</h3>${S.logs.slice(-8).map(x=>`<div class="log ${x.type}">${x.t}</div>`).join('')}</div>`}function inventory(){return `<div class="card"><h2>🎒 Инвентарь</h2>${S.inventory.map((x,i)=>`<div class="item"><b>${x.type==='weapon'?'⚔️':'🛡️'} ${x.name}</b><div class="muted">${x.atk?'⚔️ +'+x.atk:''} ${x.def?'🛡️ +'+x.def:''}</div><button class="btn ${x.equipped?'good':''}" onclick="equip(${i})">${x.equipped?'Надето':'Надеть'}</button></div>`).join('')}</div>`}function equip(i){let x=S.inventory[i];S.inventory.forEach((y,j)=>{if(y.type===x.type)y.equipped=j===i});S.hero.hp=Math.min(S.hero.hp,hpmax());save();render()}function character(){let h=S.hero;return `<div class="card"><h2>${cls().icon} ${h.name}</h2><div class="muted">${cls().name} — ${cls().desc}</div><hr>❤️ ${Math.ceil(h.hp)}/${hpmax()}<br>💧 ${h.mp}/${h.maxMp}<br>⚔️ ${atk()}<br>🛡️ ${df()}<br>⭐ Уровень ${h.level}<br>📈 ${h.xp}/${need()} XP</div><div class="card"><h3>🧠 Навыки</h3>${cls().skills.map(s=>`<div class="item"><b>${s[1]}</b><div class="muted">${s[2]}</div></div>`).join('')}</div>`}function menu(){S.screen='menu';render()}function menuScreen(){return `<div class="card"><h2>☰ Меню</h2><button class="btn" onclick="S.screen='tower';render()">🏰 Башня</button><button class="btn" onclick="S.screen='character';render()">👤 Герой</button><button class="btn" onclick="S.screen='inventory';render()">🎒 Инвентарь</button><button class="btn" onclick="save();alert('Прогресс сохранён')">💾 Сохранить</button><button class="btn dangerBtn" onclick="S.screen='home';render()">🚪 Главный экран</button></div>`}function victory(){return '<div class="card"><h1>🏆 Башня покорена</h1><div class="notice">Сердце Бездны повержено.</div><p>Твой герой сохранил весь путь, уровень и экипировку.</p></div>'}function render(){let b=S.screen==='home'?home():S.screen==='create'?create():S.screen==='tower'?tower():S.screen==='combat'?combat():S.screen==='inventory'?inventory():S.screen==='character'?character():S.screen==='menu'?menuScreen():S.screen==='victory'?victory():home();document.getElementById('app').innerHTML=header()+`<main>${b}</main>`+(S.hero&&S.screen!=='home'&&S.screen!=='create'?'<footer><div class="grid3"><button class="btn" onclick="S.screen=\'tower\';render()">🏰</button><button class="btn" onclick="S.screen=\'character\';render()">👤</button><button class="btn" onclick="S.screen=\'inventory\';render()">🎒</button></div></footer>':'')}load();render();</script></body></html>
